name: Paper example

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify source manifest
        run: python3 scripts/verify_sources.py --strict
      - name: Run paper example
        shell: bash
        run: python3 -m examples.paper_example | tee "$GITHUB_STEP_SUMMARY"
